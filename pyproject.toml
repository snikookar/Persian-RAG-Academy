[build-system]
requires = ["hatchling>=1.26", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "parsrag"
version = "0.2.0"
description = "Build, evaluate, and ship Retrieval-Augmented Generation (RAG) for Persian text — offline-first, with a free Persian course."
# The PyPI readme is README.md with relative links made absolute (see the hook below).
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Samane Nikookar" }]
keywords = [
    "persian",
    "farsi",
    "rag",
    "retrieval",
    "nlp",
    "llm",
    "retrieval-augmented-generation",
    "bm25",
    "embeddings",
    "course",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Persian",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.24",
]

[project.scripts]
parsrag = "parsrag.cli:main"

[project.optional-dependencies]
# We speak the OpenAI-compatible HTTP protocol directly, so any compatible
# server (OpenAI, vLLM, OpenRouter, Ollama's /v1 endpoint, ...) works.
openai = ["httpx>=0.27"]
ollama = ["ollama>=0.3"]
st = ["sentence-transformers>=3.0"]
faiss = ["faiss-cpu>=1.8"]
pgvector = ["pgvector>=0.3", "psycopg[binary]>=3.1"]
agent = ["langgraph>=0.2", "langchain-core>=0.3"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
loaders = ["pypdf>=4.0", "python-docx>=1.1", "beautifulsoup4>=4.12"]
all = ["parsrag[openai,ollama,st,faiss,pgvector,agent,api,loaders]"]
# Course tooling: charts in the lessons and regenerating the PDF fixtures.
dev = ["matplotlib>=3.7", "fpdf2>=2.7"]
# The Persian documentation site (mkdocs build --strict).
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/snikookar/Persian-RAG-Academy"
Documentation = "https://snikookar.github.io/Persian-RAG-Academy/"
Repository = "https://github.com/snikookar/Persian-RAG-Academy"
Issues = "https://github.com/snikookar/Persian-RAG-Academy/issues"
Changelog = "https://github.com/snikookar/Persian-RAG-Academy/blob/main/CHANGELOG.md"

# Only what users of the library need ships. Lessons, fixtures, tests, docs and
# repository tooling never do; CI checks this with scripts/check_dist.py.
[tool.hatch.build.targets.wheel]
packages = ["src/parsrag"]

[tool.hatch.build.targets.sdist]
only-include = ["src/parsrag", "README.md", "LICENSE", "pyproject.toml", "CHANGELOG.md"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Relative links work on GitHub but not on PyPI: images → raw files, other links → blob view.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]]*\])\((?!https?://|#)([^)\s]+)\)'
replacement = '\1(https://raw.githubusercontent.com/snikookar/Persian-RAG-Academy/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/snikookar/Persian-RAG-Academy/blob/main/\1)'

[tool.pytest.ini_options]
testpaths = ["tests", "lessons"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib -ra"
markers = [
    "hint(fa, en): a learner-facing hint shown by the grader when the test fails",
]

[tool.coverage.run]
source = ["parsrag"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# CI fails below this (measured 97% when the floor was introduced).
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# Code snippets in the Persian lesson READMEs are aligned by hand for readability.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003: Persian text legitimately contains characters that look like
# Latin ones (e.g. Arabic comma, ZWNJ); these warnings are noise here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["parsrag", "grader"]

[tool.ruff.lint.per-file-ignores]
# Bilingual hint strings in lesson tests are easier to read on one line.
"lessons/*/tests/*.py" = ["E501"]
# Starters keep the imports the learner will need once the TODOs are filled in.
"lessons/*/starter/*.py" = ["F401", "RUF100"]
# Long OOXML content-type strings and Persian sample sentences.
"data/fixtures/build_fixtures.py" = ["E501"]
"examples/*.py" = ["E501"]

[tool.mypy]
# `mypy` (CI) checks the library with most strict-mode checks on.
files = ["src/parsrag"]
python_version = "3.10"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_return_any = true
extra_checks = true

# Optional extras without type information (imported lazily inside functions).
[[tool.mypy.overrides]]
module = [
    "faiss.*",
    "pypdf.*",
    "docx.*",
    "bs4.*",
    "sentence_transformers.*",
    "psycopg.*",
    "pgvector.*",
    "langgraph.*",
    "langchain_core.*",
    "uvicorn.*",
    "tomli.*",
]
ignore_missing_imports = true
