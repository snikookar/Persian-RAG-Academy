name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }}, loaders + faiss + agent + api)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (loaders, faiss, agent, api extras — no API keys, no model downloads)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[loaders,faiss,agent,api,openai]" pytest pytest-cov ruff mypy
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy (type check src/parsrag, settings in pyproject.toml)
        run: mypy
      - name: Pytest with coverage (fails below the floor in pyproject.toml)
        run: pytest -ra --cov=parsrag --cov-report=term --cov-report=xml
      - name: Upload the coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
      - name: Reference solutions pass every lesson
        run: python -m grader check-solutions
      - name: Every blank starter loads and fails
        run: python -m grader check-starters
      - name: Starter fingerprints (used by `grader progress`) are up to date
        run: python -m grader fingerprint-starters --check
      - name: Eval gate — fail if quality drops below the committed baseline
        run: python -m parsrag.eval gate --baseline docs/eval/baseline.json
      - name: Committed fixtures are reproducible
        run: python data/fixtures/build_fixtures.py --check
      - name: Examples run offline
        run: |
          python examples/rag_in_50_lines.py
          python examples/normalization_impact.py
          python examples/pdf_repair_impact.py
          python examples/chunking_benchmark.py
          python examples/benchmark_embeddings.py
          python examples/vector_store_latency.py --sizes 2000 --queries 50
          python examples/hybrid_search.py
          python examples/reranking.py
          python examples/grounded_answers.py
          python examples/evaluation_report.py
          python examples/agentic_rag.py
          python examples/api_latency.py
          python examples/injection_attacks.py
          python examples/injection_test.py --help > /dev/null
          python -m parsrag.doctor
      - name: Command line works offline
        run: |
          cd "$(mktemp -d)"
          parsrag init
          parsrag ingest "$GITHUB_WORKSPACE/data/fixtures/corpus" --calibrate "$GITHUB_WORKSPACE/data/fixtures/qa.jsonl"
          parsrag ask "هزینهٔ پیک در تهران چقدر است؟"
          parsrag eval "$GITHUB_WORKSPACE/data/fixtures/qa.jsonl" --baseline b.json --update-baseline
          parsrag eval "$GITHUB_WORKSPACE/data/fixtures/qa.jsonl" --baseline b.json
      - name: README / docs-site numbers are reproducible
        run: |
          python examples/make_readme_charts.py --no-charts
          git diff --exit-code docs/eval/readme_numbers.json
      - name: Package builds and ships only the allowed files
        run: |
          pip install build twine
          python -m build
          python scripts/check_dist.py
          twine check --strict dist/*

  links:
    name: Markdown links (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Every relative link and heading anchor in the repository resolves
        run: python scripts/check_links.py

  notebook:
    name: Colab notebook (cleared outputs, offline cells run without network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (core + matplotlib for the chart cell — no sentence-transformers, no models)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Valid notebook JSON, outputs cleared, offline cells run with sockets blocked
        run: python scripts/check_notebook.py --run

  core-only:
    name: core install only (pydantic + numpy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Pytest (checks that need extras are skipped, not failed)
        run: pytest -ra
      - name: Reference solutions pass (extras checks skipped)
        run: python -m grader check-solutions
      - name: Eval gate works on the core install
        run: python -m parsrag.eval gate --baseline docs/eval/baseline.json

  docker:
    name: docker image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Is Docker available?
        id: docker
        run: |
          if docker info > /dev/null 2>&1; then echo "available=true" >> "$GITHUB_OUTPUT";
          else echo "available=false" >> "$GITHUB_OUTPUT"; echo "::notice::Docker is not available — skipping the image checks"; fi
      - name: Build the image
        if: steps.docker.outputs.available == 'true'
        run: docker build -t parsrag:ci .
      - name: Smoke test (offline FakeLLM, fixtures mounted, non-root)
        if: steps.docker.outputs.available == 'true'
        run: |
          docker run -d --name parsrag -p 8000:8000 -v "$PWD/data/fixtures/corpus:/data/docs:ro" parsrag:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS -X POST http://127.0.0.1:8000/ask -H 'content-type: application/json' \
            -d '{"question": "هزینهٔ پیک در تهران چقدر است؟"}' | tee answer.json
          grep -q '200 هزار تومان' answer.json
          test "$(docker exec parsrag id -u)" = "10001"
          docker logs parsrag | head -5
      - name: Compose file is valid
        if: steps.docker.outputs.available == 'true'
        run: docker compose config --quiet
