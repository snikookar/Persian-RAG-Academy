<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پرسش از اسناد — parsrag</title>
<style>
  /* No external requests: Vazirmatn is used if installed, otherwise a system Persian font. */
  :root {
    --bg: #f7f6f2; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e3e1da;
    --accent: #0f6e5c; --accent-soft: #e2f1ec; --mark: #fff1b8; --error: #b3261e;
    --radius: 12px;
    font-family: Vazirmatn, "Vazir", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --panel: #1f1f22; --text: #ececee; --muted: #9a9aa1; --line: #333338;
            --accent: #5cc8b0; --accent-soft: #1d3a34; --mark: #5a4a12; --error: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.9; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 1.4rem; margin: 0; }
  .muted { color: var(--muted); font-size: .9rem; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
           padding: 16px; margin-top: 16px; }
  textarea { width: 100%; min-height: 72px; resize: vertical; font: inherit; color: inherit;
             background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 6px 18px; cursor: pointer;
           background: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: progress; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  #answer { white-space: pre-wrap; font-size: 1.05rem; min-height: 1.9em; }
  .cite { display: inline-block; min-width: 1.8em; padding: 0 6px; margin: 0 2px; border-radius: 6px;
          background: var(--accent-soft); color: var(--accent); font-size: .85em; cursor: pointer;
          border: 1px solid transparent; }
  .cite:hover, .cite:focus { border-color: var(--accent); outline: none; }
  .sources { list-style: none; padding: 0; margin: 12px 0 0; }
  .sources li { border-top: 1px solid var(--line); padding: 8px 0; cursor: pointer; }
  .sources li.active { background: var(--accent-soft); }
  .passage { white-space: pre-wrap; border-inline-start: 3px solid var(--accent); padding-inline-start: 12px; }
  mark { background: var(--mark); color: inherit; }
  .error { color: var(--error); }
  .badge { font-size: .75rem; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
  #doc { max-height: 420px; overflow: auto; white-space: pre-wrap; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>پرسش از اسناد</h1>
    <span id="health" class="muted">در حال اتصال…</span>
  </header>

  <section class="panel" aria-labelledby="ask-title">
    <h2 id="ask-title" class="muted" style="margin:0;font-size:1rem">پرسش</h2>
    <textarea id="question" placeholder="مثلاً: شرایط مرجوعی کالا چیست؟" aria-label="پرسش"></textarea>
    <div class="row">
      <button id="ask">بپرس</button>
      <span class="muted">Ctrl+Enter</span>
      <span id="status" class="muted"></span>
    </div>
  </section>

  <section id="result" class="panel hidden" aria-live="polite">
    <div class="row" style="margin:0 0 8px">
      <strong>پاسخ</strong><span id="meta" class="muted"></span>
    </div>
    <div id="answer"></div>
    <ol id="sources" class="sources"></ol>
  </section>

  <section id="source" class="panel hidden">
    <div class="row" style="margin:0 0 8px">
      <strong id="source-title"></strong>
      <button id="show-doc" class="badge" style="background:transparent;color:var(--accent)">نمایش کل سند</button>
    </div>
    <div id="passage" class="passage"></div>
    <div id="doc" class="hidden"></div>
  </section>

  <section class="panel">
    <h2 class="muted" style="margin:0;font-size:1rem">افزودن سند</h2>
    <p class="muted" style="margin:4px 0">TXT، Markdown، HTML، DOCX یا PDF</p>
    <div class="row">
      <input id="files" type="file" multiple accept=".txt,.md,.markdown,.html,.htm,.docx,.pdf">
      <button id="upload">بارگذاری</button>
      <span id="upload-status" class="muted"></span>
    </div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const faDigits = (s) => String(s).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
const REASONS = {
  low_score: "شواهد کافی در اسناد پیدا نشد",
  model: "مدل گفت پاسخ در متن‌ها نیست",
  no_results: "متنی بازیابی نشد",
};
let citations = [];

async function refreshHealth() {
  try {
    const h = await (await fetch("health")).json();
    $("health").textContent =
      `${faDigits(h.documents)} سند · ${faDigits(h.chunks)} قطعه · مدل: ${h.llm}`;
  } catch {
    $("health").textContent = "سرور در دسترس نیست";
  }
}

function errorText(data, status) {
  if (data && data.message) return data.message;
  return `خطا (${status})`;
}

/** Answer text with every [n] turned into a clickable citation chip. */
function renderAnswer(text) {
  const box = $("answer");
  box.textContent = "";
  const parts = text.split(/(\[\s*[0-9۰-۹]+(?:\s*[,،]\s*[0-9۰-۹]+)*\s*\])/);
  for (const part of parts) {
    const m = part.match(/^\[(.*)\]$/);
    if (!m) { box.append(part); continue; }
    for (const raw of m[1].split(/[,،]/)) {
      const n = Number(raw.trim().replace(/[۰-۹]/g, (d) => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)));
      const chip = document.createElement("button");
      chip.className = "cite";
      chip.textContent = faDigits(n);
      chip.title = "نمایش منبع";
      chip.onclick = () => showCitation(n);
      box.append(chip);
    }
  }
}

function renderSources() {
  const list = $("sources");
  list.textContent = "";
  for (const c of citations) {
    const li = document.createElement("li");
    li.dataset.number = c.number;
    const where = [c.doc_id, c.section].filter(Boolean).join(" › ");
    li.textContent = `[${faDigits(c.number)}] ${where}${c.page ? ` (صفحهٔ ${faDigits(c.page)})` : ""}`;
    li.onclick = () => showCitation(c.number);
    list.append(li);
  }
}

function showCitation(n) {
  const c = citations.find((x) => x.number === n);
  if (!c) return;
  for (const li of $("sources").children) li.classList.toggle("active", Number(li.dataset.number) === n);
  $("source").classList.remove("hidden");
  $("source-title").textContent = [c.doc_id, c.section].filter(Boolean).join(" › ");
  $("passage").textContent = c.passage || "";
  $("doc").classList.add("hidden");
  $("passage").classList.remove("hidden");
  $("show-doc").onclick = () => showDocument(c);
  $("source").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

async function showDocument(c) {
  const r = await fetch(`documents/${encodeURIComponent(c.doc_id)}`);
  if (!r.ok) return;
  const doc = await r.json();
  const box = $("doc");
  box.textContent = "";
  if (c.start != null && c.end != null) {
    const mark = document.createElement("mark");
    mark.textContent = doc.text.slice(c.start, c.end);
    box.append(doc.text.slice(0, c.start), mark, doc.text.slice(c.end));
    box.classList.remove("hidden");
    $("passage").classList.add("hidden");
    mark.scrollIntoView({ block: "center" });
  } else {
    box.textContent = doc.text;
    box.classList.remove("hidden");
  }
}

/** POST /ask/stream and read the Server-Sent Events with fetch (EventSource is GET-only). */
async function ask() {
  const question = $("question").value.trim();
  if (!question) return;
  $("ask").disabled = true;
  $("status").textContent = "در حال جست‌وجو…";
  $("result").classList.remove("hidden");
  $("source").classList.add("hidden");
  $("answer").textContent = "";
  $("meta").textContent = "";
  $("sources").textContent = "";
  citations = [];
  let streamed = "";
  try {
    const r = await fetch("ask/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!r.ok) {
      let data = null;
      try { data = await r.json(); } catch {}
      throw new Error(errorText(data, r.status));
    }
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = buffer.indexOf("\n\n")) >= 0) {
        const block = buffer.slice(0, cut);
        buffer = buffer.slice(cut + 2);
        const event = (block.match(/^event: (.*)$/m) || [])[1];
        const data = JSON.parse((block.match(/^data: (.*)$/m) || [, "null"])[1]);
        if (event === "sources") $("status").textContent = "در حال نوشتن پاسخ…";
        if (event === "token") { streamed += data.text; $("answer").textContent = streamed; }
        if (event === "error") throw new Error(errorText(data));
        if (event === "done") {
          citations = data.citations;
          renderAnswer(data.answer);
          renderSources();
          const reason = data.abstained ? (REASONS[data.abstain_reason] || "") : "";
          const ms = Math.round(data.timings.total_ms);
          $("meta").textContent = [data.cached ? "از کش" : "", reason, `${faDigits(ms)} میلی‌ثانیه`]
            .filter(Boolean).join(" · ");
        }
      }
    }
    $("status").textContent = "";
  } catch (e) {
    $("status").textContent = "";
    $("answer").innerHTML = "";
    const p = document.createElement("span");
    p.className = "error";
    p.textContent = e.message;
    $("answer").append(p);
  } finally {
    $("ask").disabled = false;
  }
}

async function upload() {
  const files = $("files").files;
  if (!files.length) return;
  const form = new FormData();
  for (const f of files) form.append("files", f);
  $("upload").disabled = true;
  $("upload-status").textContent = "در حال نمایه‌سازی…";
  $("upload-status").classList.remove("error");
  try {
    const r = await fetch("ingest/files", { method: "POST", body: form });
    const data = await r.json();
    if (!r.ok) throw new Error(errorText(data, r.status));
    $("upload-status").textContent =
      `${faDigits(data.added_documents.length)} سند و ${faDigits(data.added_chunks)} قطعه اضافه شد`;
    $("files").value = "";
    refreshHealth();
  } catch (e) {
    $("upload-status").textContent = e.message;
    $("upload-status").classList.add("error");
  } finally {
    $("upload").disabled = false;
  }
}

$("ask").onclick = ask;
$("upload").onclick = upload;
$("question").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.ctrlKey) ask(); });
refreshHealth();
</script>
</body>
</html>
